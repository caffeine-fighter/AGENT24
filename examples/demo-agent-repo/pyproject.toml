[project]
name = "agent24-demo-agent"
version = "0.1.0"
description = "Standalone local participant Agent for the AGENT24 SandboxGym demo"
requires-python = ">=3.11,<3.14"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["example_agent"]
package-dir = {"" = "src"}

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
