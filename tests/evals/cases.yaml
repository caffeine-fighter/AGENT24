  # DomainPack registry and the evidence-driven router (issue #57).  Routing is
  # a deterministic policy, so these check the decision itself: which pack, on
  # what evidence, with which budget, and how it terminates when the evidence
  # does not single one out.
  - id: routing-normal
    runner: pytest
    issue: 57
    expectation: a payment manifest selects Life and stays executable; research, market and ticket manifests each select their own pack and name the issue that owns their execution path instead of borrowing a Life experiment
    targets:
      - tests/unit/test_packs.py::test_normal_a_payment_manifest_routes_to_life_and_stays_executable
      - tests/unit/test_packs.py::test_normal_a_research_manifest_routes_to_the_research_pack
      - tests/unit/test_packs.py::test_normal_a_market_manifest_routes_to_the_stock_pack
      - tests/unit/test_packs.py::test_normal_a_ticket_manifest_routes_to_the_ticket_pack

  - id: routing-ambiguous
    runner: pytest
    issue: 57
    expectation: two domain packs on equal score stop with insufficient_evidence naming both, rather than taking the lexically first pack; the tie becomes an UNSUPPORTED report without adding a sixth terminal status
    targets:
      - tests/unit/test_packs.py::test_tie_between_two_domain_packs_terminates_instead_of_guessing
      - tests/unit/test_packs.py::test_tie_names_every_pack_that_tied
      - tests/unit/test_packs.py::test_an_ambiguous_tie_becomes_an_unsupported_report_not_a_sixth_status

  - id: routing-unsupported
    runner: pytest
    issue: 57
    expectation: a manifest with no tools, and one whose every tool the loader rejected, both route nowhere and are not handed to the Adhoc fallback; a pack whose surface is absent never becomes a candidate
    targets:
      - tests/unit/test_packs.py::test_unsupported_a_manifest_with_no_tools_routes_nowhere
      - tests/unit/test_packs.py::test_unsupported_never_substitutes_a_pack_it_cannot_run
      - tests/unit/test_external_preflight.py::test_preflight_stops_honestly_when_manifest_tools_are_unsupported

  - id: routing-budget-and-pack-error
    runner: pytest
    issue: 57
    expectation: the selected pack's declared budget drives the loop stop conditions; a pack that raises is reported as that pack failing, never re-routed and never as a measured failure, and the run_failed payload carries the pack id without the exception message
    targets:
      - tests/unit/test_packs.py::test_budget_exhausted_uses_the_selected_packs_own_bound
      - tests/unit/test_packs.py::test_a_pack_error_names_the_pack_and_does_not_reroute
      - tests/unit/test_packs.py::test_a_pack_error_never_reports_a_measured_failure
      - tests/integration/test_api.py::test_diagnostic_failure_is_sanitized_and_ends_without_fixture_fallback

  - id: routing-determinism
