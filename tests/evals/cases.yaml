    forbidden_event_types:
      - experiment_plan
      - target.runtime.started
      - target.tool_call
      - target.oracle
      - target.replay
      - oracle.report
      - vaccine.proposed
      - replay.completed
    forbid_in_stream:
      - platform.exactly_once_payment
      - measured_failure
      - verified_mitigation
    terminal:
      status: unsupported
      execution_scope: none
      source_resolved: true
      diagnostic_completed: false
      openai_analysis_completed: false
      experiments_run: 0
      findings: 0

  - id: target-runtime-crash
    runner: target_runtime
    issue: 124
    scenario: crash
    input: 이 Agent가 결제에서 어떻게 실패하는지 진단해줘.
    expectation: a target that calls a tool the sandbox proxy does not expose fails closed as a typed target_runtime stage failure with exactly one terminal, publishes the raw call that had no result, and produces no oracle, no finding and no synthetic payment success in its place
    required_event_order:
      - target.runtime.started
      - target.tool_call
      - stage_failed
      - run_completed
    forbidden_event_types:
      - target.oracle
      - target.replay
      - target.runtime.completed
      - target.final_output
      - oracle.report
      - failure.detected
      - damage.updated
      - verification.updated
      - replay.completed
      - protected_replay
      - finding_report
      - lab_report
      - offline_demo
      - final_output
    # Only the verdict vocabulary is forbidden here, not the invariant id: the
    # crash happens after `experiment_plan`, which legitimately names
    # platform.exactly_once_payment as the invariant the experiment *intended*
    # to check. A planned check is not a measurement. The unsupported case
    # stops before planning, so there the id itself must never appear.
    forbid_in_stream:
      - measured_failure
      - verified_mitigation
    terminal:
      status: target_runtime_failed
      execution_scope: target_runtime
      source_resolved: true
      diagnostic_completed: false
      openai_analysis_completed: false
      target_runtime_completed: false
    target:
      tool_calls: 2
      tool_results: 1

  - id: target-runtime-case-declaration-binding
    runner: pytest
    issue: 124
    expectation: the target_runtime cases execute a real POST /api/runs run instead of delegating; mutating a declared ledger value, terminal field, event order, forbidden event or forbidden string fails the case and the whole registry run; the schema refuses an oracle claim on a scenario that stops before the oracle; the harness reaches no host but this one
    targets:
      - tests/evals/test_target_runtime_cases.py
