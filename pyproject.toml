[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yai-agent24"
version = "0.1.0"
description = "Creative Agent entry for YAI x OpenAI AGENT:24"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "openai-agents",
  # Imported directly by agent24.agent; JsonValue needs >= 2.5.
  "pydantic>=2.7",
  "pydantic-settings",
  # agent24.evals.registry parses tests/evals/cases.yaml, which the canonical
  # verifier runs. It was already installed transitively; relying on that would
  # make the eval gate break whenever an unrelated dependency dropped it.
  "pyyaml",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

# Versioned prompt bodies and reviewed intake catalogs are data, not modules:
# packages.find skips their directories, so a wheel would otherwise omit them.
[tool.setuptools.package-data]
"agent24.agent" = ["prompts/*.md", "fixtures/k_skill_catalog_v1.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
